<mat-toolbar color="primary" class="mat-elevation-z4 header-toolbar">
  <span class="logo">iDreamBiz</span>

  <div class="search-container">
    <mat-form-field appearance="outline" class="search-field form-field-40" >
      <input  style="width: 100%;
    border-radius: 10px;
    height: 28px;" matInput placeholder="Search" [formControl]="searchQuery" />
      <button mat-icon-button matSuffix>
        <mat-icon>search</mat-icon>
      </button>
    </mat-form-field>
  </div>
</mat-toolbar>
